name: service_bridge
description: >
  Umbrella package that re-exports service_bridge_core and all provider
  sub-packages for convenient single-import usage.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  service_bridge_core:
    path: ../service_bridge_core
  service_bridge_appsflyer:
    path: ../service_bridge_appsflyer
  service_bridge_firebase:
    path: ../service_bridge_firebase
  service_bridge_huawei:
    path: ../service_bridge_huawei
  service_bridge_insider:
    path: ../service_bridge_insider
  service_bridge_sentry:
    path: ../service_bridge_sentry

name: service_bridge_firebase
description: >-
  Firebase provider implementations for Service Bridge. Includes Analytics,
  Crashlytics, Remote Config, Cloud Messaging, and logging integrations.
version: 1.0.0
homepage: https://github.com/emresaridogan/service_bridge
repository: https://github.com/emresaridogan/service_bridge/tree/main/packages/service_bridge_firebase
issue_tracker: https://github.com/emresaridogan/service_bridge/issues

topics:
  - firebase
  - analytics
  - crash-reporting
  - push-notifications
  - remote-config

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  service_bridge_core:
    path: ../service_bridge_core
  firebase_analytics: 12.4.1
  firebase_core: 4.9.0
  firebase_crashlytics: 5.2.2
  firebase_messaging: 16.2.2
  firebase_remote_config: 6.5.1
  flutter:
    sdk: flutter
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
 
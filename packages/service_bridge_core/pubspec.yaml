name: service_bridge_core
description: >-
  Core contracts, managers, and platform detection for the Service Bridge
  ecosystem. Defines unified abstractions for analytics, crash reporting,
  push notifications, remote config, logging, deep links, and user tracking.
version: 1.0.0
homepage: https://github.com/emresaridogan/service_bridge
repository: https://github.com/emresaridogan/service_bridge/tree/main/packages/service_bridge_core
issue_tracker: https://github.com/emresaridogan/service_bridge/issues

topics:
  - service-manager
  - analytics
  - crash-reporting
  - push-notifications
  - remote-config

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  connectivity_plus: 7.1.1
  device_info_plus: 13.1.0
  package_info_plus: 10.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
name: service_bridge_sentry
description: >-
  Sentry provider implementations for Service Bridge. Includes crash
  reporting with breadcrumbs and structured logging via Sentry events.
version: 1.0.0
homepage: https://github.com/emresaridogan/service_bridge
repository: https://github.com/emresaridogan/service_bridge/tree/main/packages/service_bridge_sentry
issue_tracker: https://github.com/emresaridogan/service_bridge/issues

topics:
  - sentry
  - crash-reporting
  - logging
  - error-tracking

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  service_bridge_core:
    path: ../service_bridge_core
  sentry_flutter: ^9.21.0

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
 
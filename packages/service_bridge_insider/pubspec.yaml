name: service_bridge_insider
description: >-
  Insider provider implementations for Service Bridge. Includes analytics,
  push notification, and user tracking integrations via the Insider SDK.
version: 1.0.0
homepage: https://github.com/emresaridogan/service_bridge
repository: https://github.com/emresaridogan/service_bridge/tree/main/packages/service_bridge_insider
issue_tracker: https://github.com/emresaridogan/service_bridge/issues

topics:
  - insider
  - analytics
  - push-notifications
  - user-tracking

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  service_bridge_core:
    path: ../service_bridge_core
  # Insider SDK — replace with actual package name/version when available.
  # The Insider Flutter SDK is typically provided via their documentation.
  # insider_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5
 
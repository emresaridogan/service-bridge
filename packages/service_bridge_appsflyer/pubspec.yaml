name: service_bridge_appsflyer
description: >-
  AppsFlyer provider implementations for Service Bridge. Includes analytics
  event tracking, deep link handling, and user tracking integrations.
version: 1.0.0
homepage: https://github.com/emresaridogan/service_bridge
repository: https://github.com/emresaridogan/service_bridge/tree/main/packages/service_bridge_appsflyer
issue_tracker: https://github.com/emresaridogan/service_bridge/issues

topics:
  - appsflyer
  - analytics
  - deep-linking
  - attribution

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  service_bridge_core:
    path: ../service_bridge_core
  appsflyer_sdk: ^6.15.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
 